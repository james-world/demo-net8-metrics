receivers:
  # use the efficient otlp grpc protocol
  otlp:
    protocols:
      grpc:
        endpoint: otel-collector:4317
        
exporters:
  # metrics exporter
  prometheus:
    # prometheus will scrape from here
    endpoint: :8889
    resource_to_telemetry_conversion:
      enabled: true

  # traces exporter
  otlp:
    endpoint: jaegar:4317
    tls:
      insecure: true

  # Datadog exporter
  datadog:
    api:
      key: ${env:DD_API_KEY}
      # Set to 'datadoghq.eu' if you are using Datadog EU site
      site: datadoghq.com
      fail_on_invalid_key: true

processors:
  # enable batching by adding it to processors in the pipeline
  # this is important for performance, but disabled for demo purposes
  # https://github.com/open-telemetry/opentelemetry-collector/blob/main/processor/batchprocessor/README.md
  batch:
    send_batch_max_size: 1000
    send_batch_size: 100
    timeout: 10s
    
connectors:
  datadog/connector:

service:
  pipelines:
    metrics:
      receivers: [otlp]
      processors: [batch]
      exporters: [datadog, prometheus]
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [datadog, otlp]
    logs:
      receivers: [otlp]
      processors: [batch]
      exporters: [datadog]